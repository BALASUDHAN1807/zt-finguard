# Optional monitoring (make monitoring): Prometheus scrapes the gateway over TLS with a bearer token.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: zt-gateway
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    tls_config:
      ca_file: /run/secrets/ca_crt
      server_name: gateway
    static_configs:
      - targets: ["gateway:8443"]
rule_files: ["/etc/prometheus/alerts.yml"]
