[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = false

[theme]
base = "light"
primaryColor = "#0B3D4A"
backgroundColor = "#F3F5F6"
secondaryBackgroundColor = "#E7ECEE"
textColor = "#15262C"
font = "sans serif"
