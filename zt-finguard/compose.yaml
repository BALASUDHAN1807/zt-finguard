# ZT-FinGuard - Zero Trust FinTech microservices
#
#   make setup && make up          (Docker:  docker compose ...)
#   make setup && make up ENGINE=podman   (rootless Podman: podman compose ...)
#
# Network zones (microsegmentation). Only edge-net reaches the host.
#   edge-net : dashboard, gateway                       (published ports)
#   app-net  : gateway, account, transaction            (internal)
#   auth-net : gateway, auth, opa, risk, redis, audit,
#              account, transaction                      (internal)
#   db-net   : postgres, auth, account, transaction,
#              audit                                     (internal)
# Being on the same network is never enough: every hop is mTLS and every
# endpoint has an allow-list of workload identities (certificate CNs).

name: zt-finguard

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m,mode=1777"]
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.50
  restart: unless-stopped
  user: "10001:10001"
  ulimits:
    nofile: {soft: 4096, hard: 4096}
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "3"}

x-svc-env: &svc-env
  TLS_CERT_FILE: /run/secrets/tls_crt
  TLS_KEY_FILE: /run/secrets/tls_key
  TLS_CA_FILE: /run/secrets/ca_crt
  JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
  REDIS_PASSWORD_FILE: /run/secrets/redis_password

services:
  # ------------------------------------------------------------ data layer
  postgres:
    image: docker.io/library/postgres:16.6-alpine
    networks: [db-net]
    entrypoint: ["/bin/sh", "/etc/zt/start-postgres.sh"]
    environment:
      POSTGRES_DB: finguard
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - {source: ca_crt, target: ca_crt}
      - {source: postgres_crt, target: tls_crt}
      - {source: postgres_key, target: tls_key}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/pg_hba.conf:/etc/zt/pg_hba.conf:ro
      - ./db/start-postgres.sh:/etc/zt/start-postgres.sh:ro
    read_only: true
    tmpfs: ["/var/run/postgresql:size=8m", "/tmp:size=32m"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "finguard", "-h", "/var/run/postgresql"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7.4.1-alpine
    networks: [auth-net]
    user: "999:1000"
    entrypoint: ["/bin/sh", "-c"]
    # password goes into a tmpfs config file, never into the process arguments
    command:
      - >-
        printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis.conf &&
        exec redis-server /tmp/redis.conf --port 0 --tls-port 6379
        --tls-cert-file /run/secrets/tls_crt --tls-key-file /run/secrets/tls_key
        --tls-ca-cert-file /run/secrets/ca_crt --tls-auth-clients yes
        --tls-protocols TLSv1.3 --save '' --appendonly no
        --rename-command FLUSHALL '' --rename-command CONFIG '' --rename-command DEBUG ''
    secrets:
      - redis_password
      - {source: ca_crt, target: ca_crt}
      - {source: redis_crt, target: tls_crt}
      - {source: redis_key, target: tls_key}
    read_only: true
    tmpfs: ["/tmp:size=4m,mode=1777", "/data:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    restart: unless-stopped

  # ------------------------------------------------- identity & decisions
  opa:
    image: docker.io/openpolicyagent/opa:1.4.2-static
    networks: [auth-net]
    user: "1000:1000"
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --tls-cert-file=/run/secrets/tls_crt
      - --tls-private-key-file=/run/secrets/tls_key
      - --tls-ca-cert-file=/run/secrets/ca_crt
      - --min-tls-version=1.3
      - --authentication=tls
      - --authorization=basic
      - --log-level=info
      - /policies/authz.rego
      - /policies/system_authz.rego
    secrets:
      - {source: ca_crt, target: ca_crt}
      - {source: opa_crt, target: tls_crt}
      - {source: opa_key, target: tls_key}
    volumes:
      - ./policies/authz.rego:/policies/authz.rego:ro
      - ./policies/system_authz.rego:/policies/system_authz.rego:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    restart: unless-stopped

  risk:
    <<: *hardened
    build: {context: ./services, dockerfile: Containerfile, args: {SERVICE: risk}}
    image: zt-finguard/risk:latest
    networks: [auth-net]
    mem_limit: 768m
    cpus: 1.0
    environment:
      <<: *svc-env
      SERVICE_NAME: risk
    secrets:
      - {source: ca_crt, target: ca_crt}
      - {source: risk_crt, target: tls_crt}
      - {source: risk_key, target: tls_key}

  audit:
    <<: *hardened
    build: {context: ./services, dockerfile: Containerfile, args: {SERVICE: audit}}
    image: zt-finguard/audit:latest
    networks: [auth-net, db-net]
    environment:
      <<: *svc-env
      SERVICE_NAME: audit
    secrets:
      - {source: ca_crt, target: ca_crt}
      - {source: audit_crt, target: tls_crt}
      - {source: audit_key, target: tls_key}
    depends_on:
      postgres: {condition: service_healthy}

  auth:
    <<: *hardened
    build: {context: ./services, dockerfile: Containerfile, args: {SERVICE: auth}}
    image: zt-finguard/auth:latest
    networks: [auth-net, db-net]
    environment:
      <<: *svc-env
      SERVICE_NAME: auth
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
      SEED_USERS_FILE: /run/secrets/seed_users
    secrets:
      - {source: ca_crt, target: ca_crt}
      - {source: auth_crt, target: tls_crt}
      - {source: auth_key, target: tls_key}
      - jwt_private        # only the auth service can sign tokens
      - jwt_public
      - redis_password
      - seed_users
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      risk: {condition: service_healthy}
      audit: {condition: service_healthy}

  # ----------------------------------------------------------- app layer
  account:
    <<: *hardened
    build: {context: ./services, dockerfile: Containerfile, args: {SERVICE: account}}
    image: zt-finguard/account:latest
    networks: [app-net, auth-net, db-net]
    environment:
      <<: *svc-env
      SERVICE_NAME: account
      OPENING_BALANCE: "50000"
    secrets:
      - {source: ca_crt, target: ca_crt}
      - {source: account_crt, target: tls_crt}
      - {source: account_key, target: tls_key}
      - jwt_public
    depends_on:
      postgres: {condition: service_healthy}
      opa: {condition: service_started}
      audit: {condition: service_healthy}

  transaction:
    <<: *hardened
    build: {context: ./services, dockerfile: Containerfile, args: {SERVICE: transaction}}
    image: zt-finguard/transaction:latest
    networks: [app-net, auth-net, db-net]
    environment:
      <<: *svc-env
      SERVICE_NAME: transaction
    secrets:
      - {source: ca_crt, target: ca_crt}
      - {source: transaction_crt, target: tls_crt}
      - {source: transaction_key, target: tls_key}
      - jwt_public
    depends_on:
      postgres: {condition: service_healthy}
      opa: {condition: service_started}
      risk: {condition: service_healthy}
      audit: {condition: service_healthy}

  # ----------------------------------------------------------------- edge
  gateway:
    <<: *hardened
    build: {context: ./services, dockerfile: Containerfile, args: {SERVICE: gateway}}
    image: zt-finguard/gateway:latest
    networks: [edge-net, app-net, auth-net]
    ports: ["8443:8443"]
    environment:
      <<: *svc-env
      SERVICE_NAME: gateway
      REPORTS_DIR: /reports
      RATE_LIMIT_PER_MIN: "240"
      LOGIN_RATE_LIMIT_PER_MIN: "10"
    secrets:
      - {source: ca_crt, target: ca_crt}
      - {source: gateway_crt, target: tls_crt}
      - {source: gateway_key, target: tls_key}
      - jwt_public
      - redis_password
    volumes:
      - ./reports:/reports:ro
    depends_on:
      auth: {condition: service_healthy}
      account: {condition: service_healthy}
      transaction: {condition: service_healthy}

  dashboard:
    <<: *hardened
    build: {context: ./services, dockerfile: Containerfile, args: {SERVICE: dashboard}}
    image: zt-finguard/dashboard:latest
    networks: [edge-net]          # can only talk to the gateway, like any browser
    ports: ["8501:8501"]
    entrypoint:
      - streamlit
      - run
      - app.py
      - --server.port=8501
      - --server.sslCertFile=/run/secrets/tls_crt
      - --server.sslKeyFile=/run/secrets/tls_key
    environment:
      GATEWAY_URL: https://gateway:8443
      TLS_CA_FILE: /run/secrets/ca_crt
      HOME: /tmp
    secrets:
      - {source: ca_crt, target: ca_crt}
      - {source: dashboard_crt, target: tls_crt}
      - {source: dashboard_key, target: tls_key}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import ssl,urllib.request as u; u.urlopen('https://localhost:8501/_stcore/health', context=ssl._create_unverified_context(), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      gateway: {condition: service_healthy}

  # ------------------------------------------- runtime security (optional)
  # Falco needs kernel access (eBPF), so it is the ONE privileged container.
  # It is not started by default:  make falco   (rootful Docker/Podman only)
  falco:
    profiles: [runtime]
    image: docker.io/falcosecurity/falco:0.40.0
    privileged: true
    pid: host
    networks: [auth-net]
    command:
      - falco
      - -o
      - engine.kind=modern_ebpf
      - -o
      - json_output=true
      - -o
      - http_output.enabled=true
      - -o
      - http_output.url=https://audit:8443/falco
      - -o
      - http_output.mtls=true
      - -o
      - http_output.client_cert=/run/secrets/tls_crt
      - -o
      - http_output.client_key=/run/secrets/tls_key
      - -o
      - http_output.ca_cert=/run/secrets/ca_crt
    secrets:
      - {source: ca_crt, target: ca_crt}
      - {source: falco_crt, target: tls_crt}
      - {source: falco_key, target: tls_key}
    volumes:
      - ./falco/zt_rules.yaml:/etc/falco/rules.d/zt_rules.yaml:ro
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
    restart: unless-stopped

networks:
  edge-net: {}
  app-net: {internal: true}
  auth-net: {internal: true}
  db-net: {internal: true}

volumes:
  pgdata: {}

secrets:
  ca_crt: {file: ./certs/ca.crt}
  gateway_crt: {file: ./certs/gateway.crt}
  gateway_key: {file: ./certs/gateway.key}
  dashboard_crt: {file: ./certs/dashboard.crt}
  dashboard_key: {file: ./certs/dashboard.key}
  auth_crt: {file: ./certs/auth.crt}
  auth_key: {file: ./certs/auth.key}
  account_crt: {file: ./certs/account.crt}
  account_key: {file: ./certs/account.key}
  transaction_crt: {file: ./certs/transaction.crt}
  transaction_key: {file: ./certs/transaction.key}
  risk_crt: {file: ./certs/risk.crt}
  risk_key: {file: ./certs/risk.key}
  audit_crt: {file: ./certs/audit.crt}
  audit_key: {file: ./certs/audit.key}
  opa_crt: {file: ./certs/opa.crt}
  opa_key: {file: ./certs/opa.key}
  postgres_crt: {file: ./certs/postgres.crt}
  postgres_key: {file: ./certs/postgres.key}
  redis_crt: {file: ./certs/redis.crt}
  redis_key: {file: ./certs/redis.key}
  falco_crt: {file: ./certs/falco.crt}
  falco_key: {file: ./certs/falco.key}
  jwt_private: {file: ./secrets/jwt_private.pem}
  jwt_public: {file: ./secrets/jwt_public.pem}
  redis_password: {file: ./secrets/redis_password}
  postgres_password: {file: ./secrets/postgres_password}
  seed_users: {file: ./secrets/seed_users.json}
