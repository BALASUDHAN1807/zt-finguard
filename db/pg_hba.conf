# ZT-FinGuard pg_hba.conf
# TYPE    DATABASE  USER                              ADDRESS     METHOD
# Superuser: local Unix socket only (docker/podman exec). Never over the network.
local     all       postgres                                      peer
# Services: TLS required + client certificate whose CN == role name. No passwords.
hostssl   finguard  auth,account,transaction,audit    0.0.0.0/0   cert
hostssl   finguard  auth,account,transaction,audit    ::/0        cert
# Everything else is rejected.
host      all       all                               0.0.0.0/0   reject
host      all       all                               ::/0        reject
